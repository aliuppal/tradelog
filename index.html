<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TradeLog — Trading Journal</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'%3E%3Cline x1='4' y1='2' x2='4' y2='5' stroke='%2326a69a' stroke-width='1.5' stroke-linecap='round'/%3E%3Crect x='2.5' y='5' width='3' height='5' rx='.5' fill='%2326a69a'/%3E%3Cline x1='4' y1='10' x2='4' y2='13' stroke='%2326a69a' stroke-width='1.5' stroke-linecap='round'/%3E%3Cline x1='10' y1='4' x2='10' y2='7' stroke='%23ef5350' stroke-width='1.5' stroke-linecap='round'/%3E%3Crect x='8.5' y='7' width='3' height='6' rx='.5' fill='%23ef5350'/%3E%3Cline x1='10' y1='13' x2='10' y2='16' stroke='%23ef5350' stroke-width='1.5' stroke-linecap='round'/%3E%3Cline x1='16' y1='3' x2='16' y2='6' stroke='%2326a69a' stroke-width='1.5' stroke-linecap='round'/%3E%3Crect x='14.5' y='6' width='3' height='4' rx='.5' fill='%2326a69a'/%3E%3Cline x1='16' y1='10' x2='16' y2='14' stroke='%2326a69a' stroke-width='1.5' stroke-linecap='round'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/main.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>
  <!-- Auth Gate: shown when not logged in -->
  <div id="auth-gate" class="auth-gate hidden">
    <!-- Rendered by auth.js -->
  </div>

  <!-- App Shell: shown when logged in -->
  <div id="app-shell" class="app-shell hidden">
    <!-- Sidebar -->
    <aside class="sidebar collapsed" id="sidebar">
      <div class="sidebar-logo">
        <span class="logo-icon">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- Candlestick 1 (green, left) -->
            <line x1="4" y1="2" x2="4" y2="5" stroke="#26a69a" stroke-width="1.5" stroke-linecap="round"/>
            <rect x="2.5" y="5" width="3" height="5" rx="0.5" fill="#26a69a"/>
            <line x1="4" y1="10" x2="4" y2="13" stroke="#26a69a" stroke-width="1.5" stroke-linecap="round"/>
            <!-- Candlestick 2 (red, middle) -->
            <line x1="10" y1="4" x2="10" y2="7" stroke="#ef5350" stroke-width="1.5" stroke-linecap="round"/>
            <rect x="8.5" y="7" width="3" height="6" rx="0.5" fill="#ef5350"/>
            <line x1="10" y1="13" x2="10" y2="16" stroke="#ef5350" stroke-width="1.5" stroke-linecap="round"/>
            <!-- Candlestick 3 (green, right) -->
            <line x1="16" y1="3" x2="16" y2="6" stroke="#26a69a" stroke-width="1.5" stroke-linecap="round"/>
            <rect x="14.5" y="6" width="3" height="4" rx="0.5" fill="#26a69a"/>
            <line x1="16" y1="10" x2="16" y2="14" stroke="#26a69a" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </span>
        <span class="logo-text">TradeLog</span>
      </div>

      <!-- Collapse toggle button -->
      <button class="sidebar-collapse-btn" id="sidebar-collapse-btn" title="Toggle sidebar">
        <i class="fa-solid fa-chevron-left" id="sidebar-collapse-icon"></i>
      </button>

      <nav class="sidebar-nav">
        <a href="#dashboard" class="nav-item active" data-page="dashboard">
          <i class="fa-solid fa-gauge-high"></i><span>Dashboard</span>
        </a>
        <a href="#calendar" class="nav-item" data-page="calendar">
          <i class="fa-solid fa-calendar-days"></i><span>PNL Calendar</span>
        </a>
        <a href="#trades" class="nav-item" data-page="trades">
          <i class="fa-solid fa-list-ul"></i><span>Trade Log</span>
        </a>
        <a href="#stats" class="nav-item" data-page="stats">
          <i class="fa-solid fa-chart-line"></i><span>Statistics</span>
        </a>
        <a href="#journal" class="nav-item" data-page="journal">
          <i class="fa-solid fa-book-open"></i><span>Journal Notes</span>
        </a>

        <div class="nav-divider"></div>

        <a href="#funded" class="nav-item" data-page="funded">
          <i class="fa-solid fa-building-columns"></i><span>Funded Accounts</span>
        </a>
        <a href="#live" class="nav-item" data-page="live">
          <i class="fa-solid fa-wifi"></i><span>Live Accounts</span>
        </a>
      </nav>

      <div class="sidebar-bottom">
        <div class="user-info" id="user-info">
          <div class="user-avatar" id="user-avatar">U</div>
          <div class="user-details">
            <span class="user-name" id="user-name">Trader</span>
            <span class="user-email" id="user-email">user@email.com</span>
          </div>
        </div>
        <button class="btn-icon sign-out-btn" id="sign-out-btn" title="Sign Out">
          <i class="fa-solid fa-right-from-bracket"></i>
        </button>
      </div>
    </aside>

    <!-- Mobile top bar -->
    <header class="topbar">
      <button class="btn-icon" id="sidebar-toggle">
        <i class="fa-solid fa-bars"></i>
      </button>
      <span class="topbar-title" id="topbar-title">Dashboard</span>
      <button class="btn-primary btn-sm" id="add-trade-btn-top">
        <i class="fa-solid fa-plus"></i> Add Trade
      </button>
    </header>

    <!-- Page container -->
    <main class="page-container" id="page-container">
      <!-- Pages injected here by router -->
    </main>
  </div>

  <!-- Trade Modal -->
  <div id="trade-modal" class="modal-overlay hidden">
    <div class="modal" id="trade-modal-inner">
      <!-- Rendered by modal.js -->
    </div>
  </div>

  <!-- Toast notifications -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

  <script type="module" src="js/config.js"></script>
  <script type="module" src="js/auth.js"></script>
  <script type="module" src="js/router.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>

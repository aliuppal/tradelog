<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#090D14" />
  <meta name="description" content="TradeLog — trading journal with P&L calendar, TP/SL/BE outcomes and statistics." />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="TradeLog" />
  <title>TradeLog — Trading Journal</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' fill='%23090D14'/%3E%3Crect x='1.5' y='1.5' width='21' height='21' fill='none' stroke='%2334D399' stroke-width='1.2'/%3E%3Cpath d='M5.5 16.5 L10 11.5 L13 14.5 L18.5 8' fill='none' stroke='%2334D399' stroke-width='1.6' stroke-linecap='square'/%3E%3Ccircle cx='18.5' cy='8' r='1.7' fill='%2334D399'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/main.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>
  <!-- Auth Gate: shown when not logged in -->
  <div id="auth-gate" class="auth-gate hidden">
    <!-- Rendered by auth.js -->
  </div>

  <!-- App Shell: shown when logged in -->
  <div id="app-shell" class="app-shell hidden">
    <!-- Sidebar -->
    <aside class="sidebar collapsed" id="sidebar">
      <div class="sidebar-logo">
        <span class="logo-icon" aria-hidden="true">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="1.5" y="1.5" width="21" height="21" stroke="currentColor" stroke-width="1"/>
            <path d="M5.5 16.5 L10 11.5 L13 14.5 L18.5 8" stroke="currentColor" stroke-width="1.25" stroke-linecap="square" stroke-linejoin="miter"/>
            <circle cx="18.5" cy="8" r="1.4" fill="currentColor"/>
          </svg>
        </span>
        <span class="logo-text">TRADELOG</span>
      </div>

      <!-- Collapse toggle button -->
      <button class="sidebar-collapse-btn" id="sidebar-collapse-btn" title="Toggle sidebar">
        <i class="fa-solid fa-chevron-left" id="sidebar-collapse-icon"></i>
      </button>

      <nav class="sidebar-nav">
        <a href="#dashboard" class="nav-item active" data-page="dashboard">
          <i class="fa-solid fa-gauge-high"></i><span>Dashboard</span>
        </a>
        <a href="#calendar" class="nav-item" data-page="calendar">
          <i class="fa-solid fa-calendar-days"></i><span>PNL Calendar</span>
        </a>
        <a href="#trades" class="nav-item" data-page="trades">
          <i class="fa-solid fa-list-ul"></i><span>Trade Log</span>
        </a>
        <a href="#stats" class="nav-item" data-page="stats">
          <i class="fa-solid fa-chart-line"></i><span>Statistics</span>
        </a>
        <a href="#journal" class="nav-item" data-page="journal">
          <i class="fa-solid fa-book-open"></i><span>Journal Notes</span>
        </a>

        <div class="nav-divider"></div>

        <a href="#funded" class="nav-item" data-page="funded">
          <i class="fa-solid fa-building-columns"></i><span>Funded Accounts</span>
        </a>
        <a href="#live" class="nav-item" data-page="live">
          <i class="fa-solid fa-wifi"></i><span>Live Accounts</span>
        </a>
      </nav>

      <div class="sidebar-bottom">
        <div class="user-info" id="user-info">
          <div class="user-avatar" id="user-avatar">U</div>
          <div class="user-details">
            <span class="user-name" id="user-name">Trader</span>
            <span class="user-email" id="user-email">user@email.com</span>
          </div>
        </div>
        <button class="btn-icon sign-out-btn" id="sign-out-btn" title="Sign Out">
          <i class="fa-solid fa-right-from-bracket"></i>
        </button>
      </div>
    </aside>

    <!-- Mobile top bar -->
    <header class="topbar">
      <button class="btn-icon" id="sidebar-toggle">
        <i class="fa-solid fa-bars"></i>
      </button>
      <span class="topbar-title" id="topbar-title">Dashboard</span>
      <button class="btn-secondary btn-sm hidden" id="install-btn" title="Install TradeLog as an app">
        <i class="fa-solid fa-download"></i> Install
      </button>
      <button class="btn-primary btn-sm" id="add-trade-btn-top">
        <i class="fa-solid fa-plus"></i> Add Trade
      </button>
    </header>

    <!-- Page container -->
    <main class="page-container" id="page-container">
      <!-- Pages injected here by router -->
    </main>

    <!-- Mobile bottom tab bar -->
    <nav class="tabbar" aria-label="Primary">
      <a href="#dashboard" class="tab-item" data-page="dashboard"><i class="fa-solid fa-gauge-high"></i><span>Home</span></a>
      <a href="#calendar" class="tab-item" data-page="calendar"><i class="fa-solid fa-calendar-days"></i><span>Calendar</span></a>
      <button class="tab-add" id="tab-add-trade" aria-label="Add trade"><i class="fa-solid fa-plus"></i></button>
      <a href="#trades" class="tab-item" data-page="trades"><i class="fa-solid fa-list-ul"></i><span>Trades</span></a>
      <a href="#stats" class="tab-item" data-page="stats"><i class="fa-solid fa-chart-line"></i><span>Stats</span></a>
    </nav>
  </div>

  <!-- Trade Modal -->
  <div id="trade-modal" class="modal-overlay hidden">
    <div class="modal" id="trade-modal-inner">
      <!-- Rendered by modal.js -->
    </div>
  </div>

  <!-- Toast notifications -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

  <script type="module" src="js/config.js"></script>
  <script type="module" src="js/auth.js"></script>
  <script type="module" src="js/router.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
